<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        SEMAFORO VIRTUAL
    </title> 
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark">


    <div class="container">
        <h1 class="text-white text-center">SEMAFORO VIRTUAL</h1>

        <div class="form-check">
        <input 
            class="form-check-input" 
            type="radio" 
            name="luz" 
            id="radio_rojo"
            
            
            >
        <label class="form-check-label text-white bg-danger" for="radio_rojo">
            ROJO
        </label>

        </div>
        <div class="form-check">
        <input 
            class="form-check-input" 
            type="radio" 
            name="luz" 
            id="radio_amarillo" 
            
            
            >
        <label class="form-check-label text-white bg-warning" for="radio_amarillo">
            AMARILLO
        </label>
        </div>

        <div class="form-check">
        <input 
            class="form-check-input" 
            type="radio" 
            name="luz" 
            id="radio_verde"
            checked
            >
        <label class="form-check-label text-white bg-success" for="radio_verde">
            VERDE
        </label>
        </div>

    </div>
        

    <h1 class="text-white text-center mt-5" id="txt_resultado">Seleccione opcion</h1>
 

    <script src="./node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <!--<script src="./public/js/semaforo.js"></script>-->

</body>
</html>
